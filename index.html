<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Где отличие? Мастерская художника</title>
    <style>
        :root {
            --bg-teal: #008080;
            --accent-orange: #FF8C00;
            --accent-purple: #9370DB;
            --accent-yellow: #FFD700;
            --red: #FF4500;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-teal);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- ОКРУЖЕНИЕ СТУДИИ --- */
        .studio-env {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #006666 0%, #008080 100%);
            z-index: 1;
        }

        .wooden-table {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to bottom, #A0522D, #5D2E0B);
            border-top: 10px solid #4a2508;
            z-index: 2;
        }

        .studio-cat {
            position: absolute;
            bottom: 40px;
            right: 5%;
            font-size: 110px;
            filter: drop-shadow(10px 10px 15px rgba(0,0,0,0.5));
            transform: scaleX(-1);
            user-select: none;
            z-index: 3;
        }

        /* --- МОНИТОР --- */
        .monitor-frame {
            position: relative;
            z-index: 10;
            width: 980px;
            background: #2c2c2c;
            border: 18px solid #1a1a1a;
            border-radius: 30px;
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
            padding: 12px;
        }

        /* БРАУЗЕР С УЗОРАМИ */
        .browser-container {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 10px solid;
            border-image: repeating-linear-gradient(45deg, var(--accent-orange), var(--accent-orange) 20px, var(--accent-purple) 20px, var(--accent-purple) 40px) 20;
        }

        .browser-bar {
            background: #e0e0e0;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #ccc;
        }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
        .b-red { background: #ff5f56; }
        .b-yellow { background: #ffbd2e; }
        .b-green { background: #27c93f; }

        /* --- ИГРОВОЙ ЭКРАН --- */
        .game-screen {
            padding: 20px;
            background: radial-gradient(circle, #ffffff 0%, #f7f7f7 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-title {
            font-size: 32px;
            color: var(--accent-orange);
            margin: 0 0 10px 0;
            text-shadow: 2px 2px #fff, 3px 3px var(--accent-purple);
            font-weight: 900;
        }

        .score-board {
            background: var(--accent-yellow);
            padding: 6px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 0 #c5a000;
            margin-bottom: 20px;
        }

        /* ПОЛЯ С КАРТИНКАМИ */
        .playground {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .canvas-box {
            width: 440px;
            height: 310px;
            border: 6px solid #5D2E0B;
            border-radius: 10px;
            position: relative;
            background: #fff;
            overflow: hidden;
        }

        .tag {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 5;
            letter-spacing: 1px;
        }

        /* РИСОВАННАЯ СЦЕНА (ОБЩАЯ БАЗА) */
        .scene-base {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(to bottom, #e0f7fa, #80deea);
        }
        .floor { position: absolute; bottom: 0; width: 100%; height: 35%; background: #cd853f; border-top: 4px solid #8b4513; }
        .window-frame { position: absolute; top: 20px; left: 30px; width: 110px; height: 85px; background: #fff; border: 4px solid #5D2E0B; box-shadow: inset 0 0 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 40px;}
        
        /* Объекты */
        .obj { position: absolute; transition: all 0.3s; user-select: none; }
        .s-cactus { bottom: 35%; left: 40px; font-size: 55px; }
        .s-sun { top: 25px; right: 40px; font-size: 45px; }
        .s-cat { bottom: 15px; right: 40px; font-size: 65px; }
        .s-palette { bottom: 20px; left: 180px; font-size: 45px; }
        .s-brushes { bottom: 25px; left: 280px; font-size: 50px; }

        /* ИНТЕРАКТИВНЫЕ ЗОНЫ И МАРКЕРЫ */
        .diff-click-zone {
            position: absolute;
            cursor: pointer;
            z-index: 20;
            border-radius: 50%;
        }

        .marker-circle {
            position: absolute;
            border: 4px solid var(--red);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--red), inset 0 0 10px var(--red);
            pointer-events: none;
            display: none;
            z-index: 15;
            animation: pulse-ring 1s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }

        /* --- ПАНЕЛЬ УПРАВЛЕНИЯ --- */
        .ui-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .btn-row { display: flex; gap: 20px; }
        .game-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
            text-transform: uppercase;
            transition: 0.1s;
        }
        .game-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        .game-btn:disabled { background: #bbb !important; cursor: not-allowed; box-shadow: none; transform: none; }

        .btn-orange { background: linear-gradient(to bottom, #FF8C00, #E67E22); }
        .btn-purple { background: linear-gradient(to bottom, #9370DB, #8E44AD); }

        /* СПИСОК ОТЛИЧИЙ */
        .diff-list {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border: 3px dashed var(--accent-purple);
            border-radius: 12px;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 15px;
            color: #444;
        }
        .list-item {
            padding: 4px 10px;
            background: #f9f9f9;
            border-radius: 5px;
            transition: 0.4s;
            font-weight: 500;
        }
        .list-item.revealed {
            background: #e1f5fe;
            color: var(--accent-purple);
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="studio-env">
        <div class="wooden-table"></div>
        <div class="studio-cat">🐈</div>
    </div>

    <div class="monitor-frame">
        <div class="browser-container">
            <div class="browser-bar">
                <div class="win-btn b-red"></div>
                <div class="win-btn b-yellow"></div>
                <div class="win-btn b-green"></div>
                <span style="font-size: 12px; color: #777; margin-left: 20px;">ArtQuest_Differences_v3.html</span>
            </div>

            <div class="game-screen">
                <h1 class="game-title">ГДЕ ОТЛИЧИЕ? МАСТЕРСКАЯ ХУДОЖНИКА</h1>
                <div class="score-board">НАЙДЕНО: <span id="found-val">0</span> / 5</div>

                <div class="playground">
                    <!-- ОРИГИНАЛ (ЭТАЛОН) -->
                    <div class="canvas-box">
                        <div class="tag">ОРИГИНАЛ</div>
                        <div class="scene-base">
                            <div class="window-frame">😊</div>
                            <div class="floor"></div>
                            <div class="obj s-sun">☀️</div>
                            <div class="obj s-cactus">🌵</div>
                            <div class="obj s-palette">🎨</div>
                            <div class="obj s-brushes">🖌️</div>
                            <div class="obj s-cat">🐈</div>
                        </div>
                    </div>

                    <!-- КОПИЯ (С ОТЛИЧИЯМИ) -->
                    <div class="canvas-box">
                        <div class="tag">КОПИЯ</div>
                        <div class="scene-base">
                            <div class="window-frame" id="copy-painting">😟</div> <!-- 3. Картина изменилась -->
                            <div class="floor"></div>
                            
                            <!-- Объекты копии -->
                            <div id="copy-sun" class="obj s-sun">⛅</div> <!-- 4. Тусклое солнце -->
                            <div id="copy-cactus" class="obj s-cactus">🌵🌸</div> <!-- 2. Вырос кактус (цветок) -->
                            <div id="copy-palette" class="obj s-palette" style="filter: hue-rotate(90deg);">🎨</div> <!-- 5. Испачкана палитра -->
                            <div id="copy-brushes" class="obj s-brushes">🖌️</div> <!-- Теперь одинаковые -->
                            <div id="copy-cat" class="obj s-cat" style="filter: grayscale(1) brightness(1.2);">🐈‍⬛</div> <!-- 1. Серый кот -->

                            <!-- Красные круги (скрыты) -->
                            <div id="circ-1" class="marker-circle" style="bottom: 15px; right: 50px; width: 40px; height: 40px;"></div>
                            <div id="circ-2" class="marker-circle" style="bottom: 116px; left: 125px; width: 40px; height: 40px;"></div>
                            <div id="circ-3" class="marker-circle" style="top: 40px; left: 65px; width: 40px; height: 40px;"></div>
                            <div id="circ-4" class="marker-circle" style="top: 40px; right: 45px; width: 40px; height: 40px;"></div>
                            <div id="circ-5" class="marker-circle" style="bottom: 20px; left: 185px; width: 40px; height: 40px;"></div>

                            <!-- Зоны клика -->
                            <div class="diff-click-zone" data-id="1" style="bottom: 15px; right: 50px; width: 40px; height: 40px;"></div>
                            <div class="diff-click-zone" data-id="2" style="bottom: 116px; left: 125px; width: 40px; height: 40px;"></div>
                            <div class="diff-click-zone" data-id="3" style="top: 40px; left: 65px; width: 40px; height: 40px;"></div>
                            <div class="diff-click-zone" data-id="4" style="top: 40px; right: 45px; width: 40px; height: 40px;"></div>
                            <div class="diff-click-zone" data-id="5" style="bottom: 20px; left: 185px; width: 40px; height: 40px;"></div>
                        </div>
                    </div>
                </div>

                <div class="ui-panel">
                    <div class="btn-row">
                        <button id="restart-btn" class="game-btn btn-orange">Начать заново</button>
                        <button id="hint-btn" class="game-btn btn-purple">Подсказка (ОСТАЛОСЬ: 3)</button>
                    </div>
                    
                    <div class="diff-list">
                        <div id="li-1" class="list-item">1. ???</div>
                        <div id="li-2" class="list-item">2. ???</div>
                        <div id="li-3" class="list-item">3. ???</div>
                        <div id="li-4" class="list-item">4. ???</div>
                        <div id="li-5" class="list-item">5. ???</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- СОСТОЯНИЕ ИГРЫ ---
        const diffData = [
            { id: 1, text: '1. Кот поменял цвет', found: false, circle: 'circ-1', log: 'li-1' },
            { id: 2, text: '2. Кактус расцвел', found: false, circle: 'circ-2', log: 'li-2' },
            { id: 3, text: '3. Картина изменилась', found: false, circle: 'circ-3', log: 'li-3' },
            { id: 4, text: '4. Солнце скрылось', found: false, circle: 'circ-4', log: 'li-4' },
            { id: 5, text: '5. Палитра испачкана', found: false, circle: 'circ-5', log: 'li-5' }
        ];

        let foundCount = 0;
        let hintsLeft = 3;

        // Элементы
        const foundVal = document.getElementById('found-val');
        const hintBtn = document.getElementById('hint-btn');
        const restartBtn = document.getElementById('restart-btn');
        const clickZones = document.querySelectorAll('.diff-click-zone');

        // --- ЛОГИКА ---

        // Функция фиксации находки
        function registerFound(id) {
            const item = diffData.find(d => d.id === id);
            if (item && !item.found) {
                item.found = true;
                foundCount++;
                
                // Обновляем UI
                foundVal.innerText = foundCount;
                document.getElementById(item.circle).style.display = 'block';
                const logItem = document.getElementById(item.log);
                logItem.innerText = item.text;
                logItem.classList.add('revealed');

                // Проверка победы
                if (foundCount === 5) {
                    setTimeout(() => alert('Браво! Вы настоящий мастер и нашли все 5 отличий!'), 300);
                }
            }
        }

        // Клик по зонам
        clickZones.forEach(zone => {
            zone.addEventListener('click', () => {
                const id = parseInt(zone.getAttribute('data-id'));
                registerFound(id);
            });
        });

        // Кнопка подсказки
        hintBtn.addEventListener('click', () => {
            if (hintsLeft > 0) {
                const unfound = diffData.filter(d => !d.found);
                if (unfound.length > 0) {
                    const randomDiff = unfound[Math.floor(Math.random() * unfound.length)];
                    registerFound(randomDiff.id);
                    
                    hintsLeft--;
                    hintBtn.innerText = `Подсказка (ОСТАЛОСЬ: ${hintsLeft})`;
                    if (hintsLeft === 0) hintBtn.disabled = true;
                }
            }
        });

        // Кнопка сброса
        restartBtn.addEventListener('click', () => {
            foundCount = 0;
            hintsLeft = 3;
            foundVal.innerText = '0';
            hintBtn.innerText = `Подсказка (ОСТАЛОСЬ: 3)`;
            hintBtn.disabled = false;

            diffData.forEach(d => {
                d.found = false;
                document.getElementById(d.circle).style.display = 'none';
                const logItem = document.getElementById(d.log);
                logItem.innerText = `${d.id}. ???`;
                logItem.classList.remove('revealed');
            });
        });

    </script>
</body>
</html>
