<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Где отличие? Мастерская художника Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-teal: #008080;
            --accent-orange: #FF8C00;
            --accent-purple: #9370DB;
            --accent-yellow: #FFD700;
            --red: #FF4500;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-teal);
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- ЭКРАНЫ --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s, visibility 0.5s;
        }

        #start-menu { 
            background: linear-gradient(-45deg, #004d4d, #008080, #00b3b3, #008080);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            overflow: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-decor {
            position: absolute; 
            top: -100px;
            opacity: 0.2; 
            user-select: none; 
            pointer-events: none;
            animation: waterfall 10s linear infinite;
        }
        @keyframes waterfall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(calc(100vh + 200px)) rotate(360deg); opacity: 0; }
        }

        #level-menu { 
            background: linear-gradient(135deg, #004444, #008080); 
            background-size: 200% 200%;
            animation: gradientBG 10s ease infinite;
            opacity: 0; visibility: hidden; 
        }
        #settings-menu { background: rgba(0,0,0,0.8); opacity: 0; visibility: hidden; z-index: 11000; }
        #loader { background: #111; opacity: 0; visibility: hidden; }
        #victory-screen { background: rgba(0,0,0,0.95); opacity: 0; visibility: hidden; color: white; }

        .menu-card {
            background: white;
            padding: clamp(20px, 5vw, 45px);
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border: 10px solid var(--accent-yellow);
            color: #333;
            max-width: 90%;
            width: 450px;
            position: relative;
            z-index: 100;
            animation: popCard 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popCard { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .game-logo {
            font-size: clamp(32px, 10vw, 56px);
            color: var(--accent-orange);
            margin: 0;
            text-shadow: 3px 3px 0 #fff, 6px 6px 0 var(--accent-purple);
            animation: wiggling 2s infinite ease-in-out;
        }
        @keyframes wiggling {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10100;
            font-size: 35px;
            transition: transform 0.3s;
            border: 4px solid var(--accent-orange);
        }
        .settings-btn:hover { transform: rotate(90deg); }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
            max-height: 45vh;
            overflow-y: auto;
            padding: 5px;
        }

        .level-item {
            background: #f9f9f9;
            border: 4px solid #eee;
            border-radius: 20px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .level-item:active { transform: scale(0.95); }
        .level-icon { font-size: 30px; margin-bottom: 2px; }
        .level-stars { color: var(--accent-yellow); font-size: 12px; letter-spacing: 1px; }
        .level-best { font-size: 10px; color: #888; font-weight: bold; margin-top: 2px; }

        .btn-large {
            background: linear-gradient(to bottom, #FF8C00, #FF5F00);
            color: white; border: none;
            padding: 18px 45px;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 900;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b36200;
            margin: 10px;
            transition: all 0.1s;
            text-transform: uppercase;
        }
        .btn-large:active { transform: translateY(5px); box-shadow: 0 3px 0 #b36200; }
        .btn-purple-large { background: linear-gradient(to bottom, #9370DB, #7D5BBF); box-shadow: 0 8px 0 #5d438a; }
        .btn-blue-large { background: linear-gradient(to bottom, #3498db, #2980b9); box-shadow: 0 10px 0 #1c5980; }

        .volume-control {
            margin-top: 15px;
            background: #fff3e0;
            padding: 15px 25px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 3px solid #ffccbc;
        }
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--accent-orange); }

        /* --- ИГРОВОЙ ИНТЕРФЕЙС --- */
        .game-wrapper {
            position: relative; z-index: 10;
            display: none; flex-direction: column; align-items: center;
            width: 100%; height: 100%; padding: 5px; box-sizing: border-box;
        }

        .header {
            background: white; padding: 8px 20px; border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); text-align: center;
            margin-bottom: 8px; border: 4px solid var(--accent-orange);
            display: flex; flex-direction: column; width: 90%; max-width: 400px;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 20px; font-weight: bold; }
        .timer { color: var(--red); font-variant-numeric: tabular-nums; background: #fff1f1; padding: 2px 10px; border-radius: 10px; }

        .playground {
            flex: 1; display: flex; flex-direction: column; gap: 10px;
            width: 100%; max-width: 480px; justify-content: center; align-items: center;
        }
        @media (orientation: landscape) {
            .playground { flex-direction: row; max-width: 950px; }
            .canvas-box { width: 48%; }
        }

        .canvas-box {
            position: relative; width: 98%; aspect-ratio: 16/9;
            background: #fff; border: 5px solid #3d1f07; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;
        }

        .tag {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            background: #3d1f07; color: white; padding: 2px 20px;
            font-size: 13px; border-radius: 0 0 10px 10px; z-index: 100; font-weight: bold;
        }

        .scene { 
            width: 100%; height: 100%; 
            position: relative; 
            top: 0;
            background-size: 100% 100%; 
            background-position: center; 
            background-repeat: no-repeat;
        }

        .diff-zone {
            position: absolute; cursor: pointer; z-index: 200; border-radius: 50%;
            width: 100px; height: 100px; transform: translate(-50%, -50%);
        }

        .marker {
            position: absolute; border: 5px solid var(--red); border-radius: 50%;
            box-shadow: 0 0 15px var(--red); pointer-events: none;
            z-index: 150; display: none; width: 75px; height: 75px;
            transform: translate(-50%, -50%); animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -50%) scale(1); } }

        .footer { padding: 12px 0; z-index: 10; }
        .btn-row { display: flex; gap: 20px; }
        .btn {
            padding: 10px 30px; border: none; border-radius: 25px;
            color: white; font-weight: bold; font-size: 18px;
            cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.3);
            text-transform: uppercase; transition: 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-orange { background: var(--accent-orange); }
        .btn-purple { background: var(--accent-purple); }

    </style>
</head>
<body>

    <div id="penalty" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); color:var(--red); font-size:40px; font-weight:900; opacity:0; pointer-events:none; z-index:20000; transition:opacity 0.3s;">-5 сек</div>

    <!-- СТАРТОВОЕ МЕНЮ -->
    <div id="start-menu" class="overlay">
        <div class="settings-btn" onclick="openSettings()">⚙️</div>
        <div id="menu-decor-container"></div>
        <div class="menu-card">
            <h1 class="game-logo">АРТ КВЕСТ</h1>
            <p style="margin:5px 0 20px 0; font-weight:900; color:#555; font-size: 16px; letter-spacing: 2px;">МАСТЕРСКАЯ ХУДОЖНИКА</p>
            <button class="btn-large" onclick="openLevelMenu()">ИГРАТЬ</button>
        </div>
    </div>

    <!-- ОКНО НАСТРОЕК -->
    <div id="settings-menu" class="overlay" onclick="closeSettings()">
        <div class="menu-card" onclick="event.stopPropagation()">
            <h2 style="margin:0; color:var(--accent-orange);">НАСТРОЙКИ</h2>
            <div class="volume-control">
                <div style="width:100%; display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span>ГРОМКОСТЬ</span>
                    <span id="vol-val">50%</span>
                </div>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" oninput="updateVolume(this.value)">
                <div style="display:flex; justify-content:space-between; width:100%; font-size:20px; margin-top:5px;">
                    <span>🔇</span><span>🔊</span>
                </div>
            </div>
            <button class="btn-large" style="margin-top:20px; font-size: 16px; padding: 10px 30px;" onclick="closeSettings()">ГОТОВО</button>
        </div>
    </div>

    <!-- ВЫБОР УРОВНЯ -->
    <div id="level-menu" class="overlay">
        <div class="menu-card">
            <h2 style="margin:0; color:var(--accent-purple); font-size: 32px;">УРОВНИ</h2>
            <div class="level-grid" id="level-grid"></div>
            <button class="btn-large btn-purple-large" style="padding: 10px 30px; font-size: 16px;" onclick="showMenu()">НАЗАД</button>
        </div>
    </div>

    <!-- ЭКРАН ПОБЕДЫ -->
    <div id="victory-screen" class="overlay">
        <div class="menu-card">
            <h1 style="color:var(--accent-purple); margin:0; font-size: 42px;">УСПЕХ!</h1>
            <p id="victory-time" style="margin:10px 0; font-size: 20px; font-weight: bold;"></p>
            <div class="stars-container" id="victory-stars" style="color: var(--accent-yellow); font-size: 30px; margin: 10px 0;">⭐⭐⭐</div>
            <div style="display:flex; flex-direction:column; gap: 10px;">
                <button class="btn-large" id="next-lvl-btn" onclick="nextLevel()">ДАЛЕЕ</button>
                <button class="btn-large btn-blue-large" onclick="resetCurrentLevel()">ПОВТОРИТЬ</button>
                <button class="btn-large btn-purple-large" onclick="openLevelMenu()">К УРОВНЯМ</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loader" class="overlay">
        <div style="font-size: 50px;" id="ov-icon">🎨</div>
        <div style="color:white; font-weight:bold; margin-top:20px; font-size: 20px; letter-spacing: 2px;" id="ov-text">ЗАГРУЗКА...</div>
    </div>

    <div class="game-wrapper" id="game-ui">
        <div class="header">
            <div class="top-bar">
                <span id="lvl-info" style="color:var(--accent-purple); font-size: 18px;">УРОВЕНЬ 1</span>
                <span class="timer">⏱️ <span id="timer-val">00:00</span></span>
            </div>
            <div style="font-weight:900; font-size:22px; color:var(--accent-orange);">НАЙДЕНО: <span id="score">0</span> / <span id="max-score">5</span></div>
        </div>

        <div class="playground">
            <div class="canvas-box" onclick="handleWrongClick()">
                <div class="tag">ОРИГИНАЛ</div>
                <div class="scene" id="scene-orig"></div>
            </div>
            <div class="canvas-box" id="copy-container" onclick="handleWrongClick()">
                <div class="tag">КОПИЯ</div>
                <div class="scene" id="scene-copy"></div>
            </div>
        </div>

        <div class="footer">
            <div class="btn-row">
                <button class="btn btn-purple" onclick="openLevelMenu()">🏠 МЕНЮ</button>
                <button class="btn btn-orange" onclick="resetCurrentLevel()">ЗАНОВО</button>
                <button class="btn btn-purple" id="hint-btn" onclick="useHint()">ПОМОЩЬ (3)</button>
            </div>
        </div>
    </div>

    <script>
        const audio = { bg: new Audio('bg_music.mp3'), success: new Audio('success.mp3'), error: new Audio('error.mp3'), victory: new Audio('victory.mp3') };
        audio.bg.loop = true;
        let masterVol = 0.5;

        function playFaded(a, peak, dur=800) {
            a.volume = 0; a.currentTime = 0; a.play().catch(()=>{});
            let start = Date.now();
            const anim = () => {
                let el = Date.now() - start;
                if (el < dur*0.2) a.volume = (el/(dur*0.2))*peak;
                else if (el > dur*0.5) a.volume = Math.max(0, peak*(1-(el-dur*0.5)/(dur*0.5)));
                if (el < dur) requestAnimationFrame(anim); else a.volume = 0;
            };
            requestAnimationFrame(anim);
        }

        function fadeInMusic(dur, target) {
            audio.bg.volume = 0; audio.bg.play().catch(()=>{});
            let start = Date.now();
            const anim = () => {
                let progress = (Date.now() - start) / dur;
                if (progress < 1) { audio.bg.volume = target * progress; requestAnimationFrame(anim); }
                else { audio.bg.volume = target; }
            };
            requestAnimationFrame(anim);
        }

        function updateVolume(v) { 
            masterVol = parseFloat(v); 
            audio.bg.volume = masterVol * 0.3;
            document.getElementById('vol-val').innerText = Math.round(masterVol * 100) + '%';
        }

        function openSettings() {
            const s = document.getElementById('settings-menu');
            s.style.visibility = 'visible'; s.style.opacity = 1;
        }

        function closeSettings() {
            const s = document.getElementById('settings-menu');
            s.style.opacity = 0; setTimeout(() => s.style.visibility = 'hidden', 500);
        }

        const levels = [
            { id: 0, name: "Рыцарь: Закат", icon: "🪖", bg: "url('оригинал 1 уровня.png')", copyBg: "url('копия 1 уровня.png')", diffs: [{ id: 1, x: '86%', y: '32%', r: 150 }, { id: 2, x: '50%', y: '22%' }, { id: 3, x: '13%', y: '60%' }] },
            { id: 1, name: "Катакомбы: Орден", icon: "💀", bg: "url('level2_original.png')", copyBg: "url('level2_diff.png')", diffs: [{ id: 1, x: '80%', y: '88%' }, { id: 2, x: '50%', y: '50%' }, { id: 3, x: '63%', y: '48%' }, { id: 5, x: '15%', y: '86%' }, { id: 6, x: '92%', y: '48%' }] },
            { id: 2, name: "Древний Склеп", icon: "📜", bg: "url('level3_original.png')", copyBg: "url('level3_diff.png')", diffs: [{ id: 1, x: '10%', y: '45%' }, { id: 2, x: '88%', y: '63%' }, { id: 3, x: '40%', y: '20%' }, { id: 4, x: '32%', y: '35%' }, { id: 5, x: '17%', y: '85%' }] },
            { id: 3, name: "Зимний Лес", icon: "❄️", bg: "linear-gradient(to bottom, #e0f2f1 70%, #ffffff 70%)", diffs: [{ id: 1, x: '85%', y: '15%', orig: '☀️', copy: '❄️' }, { id: 2, x: '20%', y: '75%', orig: '🌲', copy: '⛄' }, { id: 3, x: '80%', y: '80%', orig: '🛖', copy: '🏰' }, { id: 4, x: '50%', y: '45%', orig: '🐦', copy: '🐧' }, { id: 5, x: '45%', y: '90%', orig: '🐇', copy: '🦌' }], static: [{ x: '30%', y: '15%', icon: '☁️' }, { x: '70%', y: '20%', icon: '🌨️' }, { x: '10%', y: '90%', icon: '🪵' }] },
            { id: 4, name: "Космос", icon: "🚀", bg: "linear-gradient(to bottom, #000000, #2c3e50)", diffs: [{ id: 1, x: '15%', y: '20%', orig: '🌍', copy: '🪐' }, { id: 2, x: '85%', y: '85%', orig: '👨‍🚀', copy: '👽' }, { id: 3, x: '50%', y: '55%', orig: '🚀', copy: '🛸' }, { id: 4, x: '80%', y: '25%', orig: '⭐', copy: '☄️' }, { id: 5, x: '20%', y: '80%', orig: '🛰️', copy: '🔭' }], static: [{ x: '50%', y: '10%', icon: '🌌' }, { x: '90%', y: '50%', icon: '✨' }, { x: '10%', y: '50%', icon: '🌠' }] }
        ];

        let curLvlIdx = 0; let score = 0; let hintsLeft = 3; let foundIds = new Set();
        let totalSec = 0; let timerInt;
        let progress = JSON.parse(localStorage.getItem('artQuestStars')) || {};
        let bestTimes = JSON.parse(localStorage.getItem('artQuestBestTimes')) || {};

        function showMenu() { 
            document.querySelectorAll('.overlay').forEach(o => {o.style.opacity=0; o.style.visibility='hidden';}); 
            document.getElementById('start-menu').style.opacity=1; document.getElementById('start-menu').style.visibility='visible'; 
            document.getElementById('game-ui').style.display='none'; clearInterval(timerInt); audio.bg.pause();
        }

        function openLevelMenu() {
            document.querySelectorAll('.overlay').forEach(o => {o.style.opacity=0; o.style.visibility='hidden';});
            const lm = document.getElementById('level-menu'); lm.style.opacity = 1; lm.style.visibility = 'visible';
            const grid = document.getElementById('level-grid'); grid.innerHTML = '';
            levels.forEach((l, i) => {
                const item = document.createElement('div'); item.className = 'level-item';
                const s = progress[i] || 0;
                const best = bestTimes[i] ? `Лучшее: ${bestTimes[i]}с` : '---';
                item.innerHTML = `
                    <div class="level-icon">${l.icon}</div>
                    <div style="font-weight:900; font-size:12px">${l.name.toUpperCase()}</div>
                    <div class="level-stars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div>
                    <div class="level-best">${best}</div>
                `;
                item.onclick = () => startLevel(i);
                grid.appendChild(item);
            });
        }

        function startLevel(idx) {
            curLvlIdx = idx; totalSec = 0; hintsLeft = 3; foundIds.clear();
            document.querySelectorAll('.overlay').forEach(o => {o.style.opacity=0; o.style.visibility='hidden';});
            document.getElementById('game-ui').style.display = 'flex';
            if (audio.bg.paused) fadeInMusic(2000, masterVol * 0.3);
            loadLevel(idx); startTimer();
        }

        function startTimer() { clearInterval(timerInt); timerInt = setInterval(() => { totalSec++; updateTimerUI(); }, 1000); }
        function updateTimerUI() { const m = Math.floor(totalSec/60).toString().padStart(2,'0'), s = (totalSec%60).toString().padStart(2,'0'); document.getElementById('timer-val').innerText = `${m}:${s}`; }

        function handleWrongClick() { playFaded(audio.error, masterVol, 500); totalSec += 5; updateTimerUI(); const p = document.getElementById('penalty'); p.style.opacity = 1; setTimeout(() => p.style.opacity = 0, 600); }

        function loadLevel(idx) {
            const loader = document.getElementById('loader'), lvl = levels[idx];
            loader.style.opacity = 1; loader.style.visibility = 'visible';
            setTimeout(() => {
                score = 0; foundIds.clear();
                document.getElementById('score').innerText = '0'; document.getElementById('max-score').innerText = lvl.diffs.length;
                const o = document.getElementById('scene-orig'), c = document.getElementById('scene-copy');
                o.style.backgroundImage = lvl.bg;
                c.style.backgroundImage = lvl.copyBg || lvl.bg;
                o.innerHTML = c.innerHTML = '';
                lvl.diffs.forEach(d => {
                    const m = document.createElement('div'); m.className='marker'; m.id=`m-${d.id}`; m.style.left=d.x; m.style.top=d.y; c.appendChild(m);
                    const z = document.createElement('div'); z.className='diff-zone'; z.style.left=d.x; z.style.top=d.y; if(d.r) { z.style.width = z.style.height = d.r + 'px'; }
                    z.onclick=(e)=>{e.stopPropagation(); handleFound(d.id, e);}; c.appendChild(z);
                });
                document.getElementById('hint-btn').innerText = `ПОМОЩЬ (3)`; document.getElementById('hint-btn').disabled = false;
                setTimeout(() => { loader.style.opacity = 0; setTimeout(() => loader.style.visibility = 'hidden', 500); }, 600);
            }, 600);
        }

        function handleFound(id, event) {
            if (foundIds.has(id)) return;
            foundIds.add(id); score++; 
            playFaded(audio.success, masterVol, 800);
            document.getElementById('score').innerText = score; document.getElementById(`m-${id}`).style.display = 'block';
            if (score === levels[curLvlIdx].diffs.length) setTimeout(showVictory, 800);
        }

        function showVictory() {
            clearInterval(timerInt);
            let s = 1; if (totalSec <= 15) s = 3; else if (totalSec <= 30) s = 2;
            if (!progress[curLvlIdx] || s > progress[curLvlIdx]) { progress[curLvlIdx] = s; localStorage.setItem('artQuestStars', JSON.stringify(progress)); }
            if (!bestTimes[curLvlIdx] || totalSec < bestTimes[curLvlIdx]) { bestTimes[curLvlIdx] = totalSec; localStorage.setItem('artQuestBestTimes', JSON.stringify(bestTimes)); }
            document.getElementById('victory-time').innerText = `Время: ${totalSec} сек`;
            document.getElementById('victory-stars').innerText = '⭐'.repeat(s) + '☆'.repeat(3-s);
            document.getElementById('next-lvl-btn').style.display = (curLvlIdx < levels.length - 1) ? 'block' : 'none';
            document.getElementById('victory-screen').style.visibility = 'visible'; document.getElementById('victory-screen').style.opacity = 1;
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            audio.victory.volume = masterVol; audio.victory.play().catch(()=>{});
        }

        function nextLevel() { startLevel(curLvlIdx + 1); }
        function resetCurrentLevel() { startLevel(curLvlIdx); }
        function useHint() { if (hintsLeft > 0) { const u = levels[curLvlIdx].diffs.find(o => !foundIds.has(o.id)); if (u) { hintsLeft--; document.getElementById('hint-btn').innerText=`ПОМОЩЬ (${hintsLeft})`; if(hintsLeft===0)document.getElementById('hint-btn').disabled=true; handleFound(u.id); } } }
        
        function createMenuDecor() {
            const container = document.getElementById('menu-decor-container');
            const icons = ['🎨', '🖌️', '🌈', '✨', '⭐', '🎈', '🖍️', '🖼️'];
            for (let i = 0; i < 30; i++) {
                const el = document.createElement('div'); el.className = 'bg-decor'; el.innerText = icons[Math.floor(Math.random() * icons.length)];
                el.style.left = Math.random() * 100 + 'vw'; el.style.animationDuration = (5 + Math.random() * 10) + 's';
                el.style.animationDelay = (Math.random() * 10) + 's'; el.style.fontSize = (20 + Math.random() * 40) + 'px';
                container.appendChild(el);
            }
        }
        window.onload = () => { createMenuDecor(); showMenu(); };
    </script>
</body>
</html>
